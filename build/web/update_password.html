<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Airnet - Update Password</title>
        <link rel="icon" href="assets/images/airnet_logo.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/update_password.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>

    <body>
        <!-- Header section with the Airnet logo and Sign In button -->
        <div class="header">
            <a href="index.html" class="logo">AIRNET</a>
        </div>

        <!-- Main container for the update password form -->
        <div class="update-password-container">
            <div class="update-password-card">
                <h1 class="text-center mb-3">Update Your Password</h1>
                <p class="text-center mb-4 description-text">
                    Enter a new password for your Airnet account.
                </p>

                <!-- Notification Area - HIGHLIGHTED CHANGE -->
                <div class="notification-area text-center d-none" id="loginNotification">
                    <p class="notification-text" id="notification"></p>
                </div>

                <!-- Update password form -->
                <div class="mb-3 password-input-group">
                    <input type="password" class="form-control" id="newPassword" name="newPassword"
                           placeholder="New password" required minlength="6">
                    <span class="password-toggle" onclick="togglePasswordVisibility('newPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="mb-3 password-input-group">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                           placeholder="Confirm new password" required minlength="6">
                    <span class="password-toggle" onclick="togglePasswordVisibility('confirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4" onclick="updatePassword();">Update Password</button>
                <div class="text-center mt-3">
                    <a href="signin.html" class="back-to-login-link">Back to Sign In</a>
                </div>
            </div>
        </div>

        <!-- Footer section -->
        <div class="footer">
            <div class="footer-content">
                <p class="mb-4">Questions? Call <a href="#" class="footer-link">+94 77 523 8185</a></p>
                <div class="row footer-links">
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">FAQ</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Help Center</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Terms of Use</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Privacy</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Cookie Preferences</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Corporate Information</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer section -->

        <script src="assets/js/update_password.js"></script>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcOdihg7paX5Mtsw4sQ"
        crossorigin="anonymous"></script>
        <script>
                    // JavaScript function to toggle password visibility
                    function togglePasswordVisibility(id, iconElement) {
                        const input = document.getElementById(id);
                        const icon = iconElement.querySelector('i');
                        if (input.type === "password") {
                            input.type = "text";
                            icon.classList.remove('fa-eye');
                            icon.classList.add('fa-eye-slash');
                        } else {
                            input.type = "password";
                            icon.classList.remove('fa-eye-slash');
                            icon.classList.add('fa-eye');
                        }
                    }

        </script>
    </body>

</html>

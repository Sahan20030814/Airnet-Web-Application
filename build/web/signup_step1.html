<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Airnet</title>
        <link rel="icon" href="assets/images/airnet_logo.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/signup_step1.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>

    <body>
        <!-- Header section with the Airnet logo and Sign In button -->
        <div class="header">
            <a href="index.html" class="logo">AIRNET</a>
            <a href="signin.html" class="btn btn-outline-light sign-in-btn">Sign In</a>
        </div>

        <!-- Main container for the sign-up form -->
        <div class="signup-container">
            <div class="signup-card">
                <p class="step-text">STEP 1 OF 3</p>
                <h1 class="text-center">Create your account</h1>
                <h2 class="text-center mb-4">Just a few more steps and you're done! We hate paperwork, too.</h2>

                <!-- Notification Area - HIGHLIGHTED CHANGE -->
                <div class="notification-area text-center d-none" id="loginNotification">
                    <p class="notification-text" id="notification"></p>
                </div>

                <!-- Sign-up form -->
                <div class="mb-3">
                    <input type="text" class="form-control text-light" id="firstName" name="firstName" placeholder="First name"
                           required>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control text-light" id="lastName" name="lastName" placeholder="Last Name"
                           required>
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control text-light" id="email" name="email" placeholder="Email address"
                           required>
                </div>
                <div class="mb-3 password-input-group">
                    <input type="password" class="form-control text-light" id="password" name="password"
                           placeholder="Add a password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <button class="btn btn-primary w-100 mt-4" onclick="signup();">Continue</button>
            </div>
        </div>

        <!-- Footer section -->
        <div class="footer">
            <div class="footer-content">
                <p class="mb-4">Questions? Call <a href="#" class="footer-link">+94 77 523 8185</a></p>
                <div class="row footer-links">
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">FAQ</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Help Center</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Terms of Use</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Privacy</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Cookie Preferences</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Corporate Information</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer section -->

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcOdihg7paX5Mtsw4sQ"
        crossorigin="anonymous"></script>

        <script src="assets/js/signup_step1.js"></script>

        <script>
                    // JavaScript function to toggle password visibility
                    function togglePasswordVisibility(id, iconElement) {
                        const input = document.getElementById(id);
                        const icon = iconElement.querySelector('i');
                        if (input.type === "password") {
                            input.type = "text";
                            icon.classList.remove('fa-eye');
                            icon.classList.add('fa-eye-slash');
                        } else {
                            input.type = "password";
                            icon.classList.remove('fa-eye-slash');
                            icon.classList.add('fa-eye');
                        }
                    }
        </script>

    </body>

</html>

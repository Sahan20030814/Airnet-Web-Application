<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Airnet</title>
        <link rel="icon" href="assets/images/airnet_logo.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/signup_step1.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <!-- Header section with the Airnet logo and Sign In button -->
        <div class="header">
            <a href="index.html" class="logo">AIRNET</a>
            <a href="signin.html" class="btn btn-outline-light sign-in-btn">Sign In</a>
        </div>

        <!-- Main container for the sign-up verification process -->
        <div class="signup-container">
            <div class="signup-card verification-card">
                <p class="step-text">STEP 3 OF 3</p>
                <h1 class="mb-3 text-center">Email verification</h1>
                <h2 class="mb-4 text-center">We've sent a 6-digit code to your email address.</h2>

                <!-- Notification Area - HIGHLIGHTED CHANGE -->
                <div class="notification-area text-center d-none" id="loginNotification">
                    <p class="notification-text" id="notification"></p>
                </div>

                <!-- Verification code form -->
                <div class="mb-3">
                    <input type="text" class="form-control text-center verification-input text-light" id="verificationCode"
                           name="verificationCode" placeholder="Enter code" required maxlength="6" pattern="[0-9]{6}"
                           title="Please enter a 6-digit code">
                </div>
                <div class="text-center mb-4">
                    <a href="#" class="resend-code-link" style="text-decoration: none;" onclick="resendCode();">Resend Code</a>
                    <div class="spinner-border spinner-border-sm text-light ms-2 d-none" role="status" id="resendSnipper"> </div>
                </div>

                <button class="btn btn-primary w-100 mt-4" onclick="verifyAccount();">Verify</button>
            </div>
        </div>

        <!-- Footer section -->
        <div class="footer">
            <div class="footer-content">
                <p class="mb-4">Questions? Call <a href="#" class="footer-link">+94 77 523 8185</a></p>
                <div class="row footer-links">
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">FAQ</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Help Center</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Terms of Use</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Privacy</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Cookie Preferences</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Corporate Information</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer section -->

        <script src="assets/js/signup_step3.js"></script>

        <!-- Bootstrap JS (optional) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcOdihg7paX5Mtsw4sQ"
        crossorigin="anonymous"></script>
    </body>

</html>

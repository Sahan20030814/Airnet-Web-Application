<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Airnet - Admin View</title>
        <link rel="icon" href="assets/images/airnet_logo.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/buying_content_view.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" type="text/css" href="https://common.olemiss.edu/_js/sweet-alert/sweet-alert.css">
    </head>

    <body>
        <!-- Header/Navigation Bar -->
        <header class="header">
            <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
                <a href="index.html" class="logo">AIRNET</a>

                <!-- Navigation Links Section -->
                <nav class="header-nav d-flex align-items-center">
                    <h1>Admin Panel</h1>
                </nav>

                <!-- User Authentication Section -->
                <div id="auth-section">
                    <div class="dropdown d-none" id="myAccount_btn">
                        <button class="btn btn-secondary dropdown-toggle user-dropdown" type="button" id="userDropdown"
                                data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle"></i> Hello Admin
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item text-center py-1" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </div>
                </div>

            </div>
        </header>
        <!-- Header/Navigation Bar -->

        <main class="main-content container-fluid d-flex flex-column align-items-center justify-content-center py-5">
            <div class="go-back-btn-container mb-3">
                <a class="btn btn-outline-light btn-sm" href="#" id="go-back-btn-a">
                    <i class="fas fa-arrow-left me-2"></i> Go Back
                </a>
            </div>

            <div class="video-container shadow-lg rounded-4 overflow-hidden mb-4 d-none" id="episode-view-container">
                <video controls controlsList="nodownload" id="videoPlayer" class="w-100" src=""</video>
            </div>
            <h1 class="text-white text-center" id="content-name"></h1>
            <div class="episode-selector-container">
                <label for="episodeSelector" class="form-label text-white-50">Select Episode</label>
                <select class="form-select" id="episodeSelector" onchange="setEpisodeVideo();">
                </select>
            </div>
        </main>
        <!-- HIGHLIGHT END -->

        <script src="https://common.olemiss.edu/_js/sweet-alert/sweet-alert.min.js"></script>
        <script src="assets/js/check_admin_index.js"></script>
        <script src="assets/js/admin_buying_content_view.js"></script>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcOdihg7paX5Mtsw4sQ"
        crossorigin="anonymous"></script>

    </body>

</html>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Airnet - Verify Code</title>
        <link rel="icon" href="assets/images/airnet_logo.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/forgot_password.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <!-- Header section with the Airnet logo and Sign In button -->
        <div class="header">
            <a href="index.html" class="logo">AIRNET</a>
        </div>

        <!-- Main container for the forgot password verification form -->
        <div class="forgot-password-container">
            <div class="forgot-password-card verification-card">
                <h1 class="mb-3">Enter the verification code</h1>
                <p class="mb-4 description-text">
                    We've sent a 6-digit code to your email address.
                </p>

                <!-- Notification Area - HIGHLIGHTED CHANGE -->
                <div class="notification-area text-center d-none" id="loginNotification">
                    <p class="notification-text" id="notification"></p>
                </div>

                <!-- Verification code form -->
                <div class="mb-3">
                    <input type="text" class="form-control text-center verification-input text-light" id="verificationCode"
                           name="verificationCode" placeholder="Enter code" required maxlength="6" pattern="[0-9]{6}"
                           title="Please enter a 6-digit code">
                </div>
                <div class="text-center mb-4">
                    <a href="#" class="resend-code-link" style="text-decoration: none; font-size: 16px;" onclick="resendCode();">Resend Code</a>
                    <div class="spinner-border spinner-border-sm text-light ms-2 d-none" role="status" id="resendSnipper"> </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4" onclick="verifyCode();">Verify</button>

                <div class="text-center mt-3">
                    <a href="admin_signin.html" class="back-to-login-link">Back to Sign In</a>
                </div>
            </div>
        </div>

        <script src="assets/js/admin_forgot_password.js"></script>

        <!-- Bootstrap JS (optional) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcOdihg7paX5Mtsw4sQ"
        crossorigin="anonymous"></script>
    </body>

</html>

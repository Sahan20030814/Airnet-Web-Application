<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Airnet</title>
        <link rel="icon" href="assets/images/airnet_logo.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/signin.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>

    <body>
        <!-- Header section with the Airnet logo -->
        <div class="header">
            <a href="index.html" class="logo">AIRNET</a>
            <a href="admin_signin.html" class="btn btn-outline-light sign-in-btn">Admin</a>
        </div>

        <!-- Main container for the login form -->
        <div class="login-container">
            <div class="login-card">
                <h1>Sign In</h1>

                <!-- Notification Area - HIGHLIGHTED CHANGE -->
                <div class="notification-area text-center d-none" id="loginNotification">
                    <p class="notification-text" id="notification"></p>
                </div>

                <!-- Sign-in form -->
                <div class="mb-3">
                    <input type="email" class="form-control text-light" id="email" name="email" placeholder="Email Address"
                           required>
                </div>

                <div class="mb-3 password-input-group">
                    <input type="password" class="form-control text-light" id="password" name="password"
                           placeholder="Password" required>
                    <span class="password-toggle" onclick="togglePasswordVisibility('password', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>

                <button class="btn btn-primary w-100" onclick="signin();">Sign In</button>
                <div class="form-help d-flex justify-content-between align-items-center mt-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="need-help" onclick="forgotPassword();">Forgot password?</a>
                </div>

                <!-- Sign-up and reCAPTCHA section -->
                <div class="signup-section mt-4">
                    <p class="mb-2">New to Airnet? <a href="signup_step1.html" class="signup-link">Sign up now</a>.</p>
                    <small class="d-block">
                        This page is protected by Google reCAPTCHA to ensure you're not a bot.
                        <a href="#" class="learn-more">Learn more.</a>
                    </small>
                </div>
            </div>
        </div>

        <!-- Footer section -->
        <div class="footer">
            <div class="footer-content">
                <p class="mb-4">Questions? Call <a href="#" class="footer-link">+94 77 523 8185</a></p>
                <div class="row footer-links">
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">FAQ</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Help Center</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Terms of Use</a>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <a href="#" class="footer-link">Privacy</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Cookie Preferences</a>
                    </div>
                    <div class="col-6 col-md-3 mb-2">
                        <a href="#" class="footer-link">Corporate Information</a>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer section -->

        <script src="assets/js/signin.js"></script>

        <!-- Bootstrap JS (optional, for components like dropdowns, modals, etc. Not strictly needed for this page but good practice to include) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcOdihg7paX5Mtsw4sQ"
        crossorigin="anonymous"></script>

        <script>
                        // JavaScript function to toggle password visibility
                        function togglePasswordVisibility(id, iconElement) {
                            const input = document.getElementById(id);
                            const icon = iconElement.querySelector('i');
                            if (input.type === "password") {
                                input.type = "text";
                                icon.classList.remove('fa-eye');
                                icon.classList.add('fa-eye-slash');
                            } else {
                                input.type = "password";
                                icon.classList.remove('fa-eye-slash');
                                icon.classList.add('fa-eye');
                            }
                        }

        </script>

    </body>

</html>

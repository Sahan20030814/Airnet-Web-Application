<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Airnet - Admin View</title>
        <link rel="icon" href="assets/images/airnet_logo.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/single_product_view.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" type="text/css" href="https://common.olemiss.edu/_js/sweet-alert/sweet-alert.css">
    </head>

    <body>
        <!-- Header/Navigation Bar -->
        <header class="header">
            <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
                <a href="index.html" class="logo">AIRNET</a>

                <!-- Navigation Links Section -->
                <nav class="header-nav d-flex align-items-center">
                    <h1>Admin Panel</h1>
                </nav>

                <!-- User Authentication Section -->
                <div id="auth-section">
                    <div class="dropdown d-none" id="myAccount_btn">
                        <button class="btn btn-secondary dropdown-toggle user-dropdown" type="button" id="userDropdown"
                                data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle"></i> Hello Admin
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item text-center py-1" href="#" onclick="logout()">Logout</a></li>
                        </ul>
                    </div>
                </div>

            </div>
        </header>

        <!-- Main content area start -->
        <main class="main-content container-fluid" style="background-color: #1a1a1a;">
            <div class="row">

                <!-- Main Content Area for Drama Details - Now full width -->
                <section class="admin-content-area col-12">

                    <div class="drama-detail-section d-none" id="main-card-container">
                        <div class="drama-background-poster">
                            <!-- Background image now set via <img> tag -->
                            <img src="" id="main-content-background-image"
                                 alt="Drama Background" class="drama-bg-img">
                        </div>
                        <div class="drama-content-container container">
                            <div class="row">
                                <div class="col-md-4 col-sm-12 drama-poster-col">
                                    <div class="drama-poster-card">
                                        <img src="https://placehold.co/300x450/333333/ffffff?text=Drama+Poster" id="main-content-card-image"
                                             alt="Drama Poster" class="img-fluid rounded-lg" >
                                    </div>
                                </div>
                                <div class="col-md-8 col-sm-12 drama-info-col">
                                    <h1 class="drama-title" id="main-content-title"></h1>
                                    <div class="drama-meta d-flex flex-wrap align-items-center mb-3">
                                        <span class="drama-quality badge bg-danger me-2" id="main-content-quality"></span>
                                        <span class="drama-imdb-rating me-3" id="main-content-rating"><i class="fas fa-star text-warning"></i></span>
                                        <button class="btn btn-sm btn-outline-light trailer-btn me-3" id="main-content-trailer-btn"><i
                                                class="fas fa-film me-1"></i> Trailer</button>
                                        <span class="drama-price badge bg-success" id="main-content-price"></span>
                                    </div>
                                    <p class="drama-description mb-4" id="main-content-description"></p>
                                    <div class="drama-details-list mb-4">
                                        <div class="row">
                                            <div class="col-lg-6">
                                                <p id="main-content-released-at"><strong>Released:</strong></p>
                                                <p id="main-content-genre"><strong>Genre:</strong></p>
                                                <p id="main-content-language"><strong>Language:</strong></p>
                                                <p id="main-content-cast"><strong>Cast:</strong></p>
                                            </div>
                                            <div class="col-lg-6">
                                                <p id="main-content-duration"><strong>Duration:</strong></p>
                                                <p id="main-content-country"><strong>Country:</strong></p>
                                                <p id="main-content-episode-count"><strong>Episodes:</strong></p>
                                                <p id="main-content-production"><strong>Production:</strong></p>
                                            </div>
                                        </div>

                                    </div>
                                    <div class="drama-actions">
                                        <a class="btn btn-danger btn-lg me-3" href="#" id="main-content-watch-now-btn"><i class="fas fa-check-circle me-2"></i> Check Now</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </section>
            </div>
        </main>

        <!-- Video Modal Overlay -->
        <div class="video-modal-overlay" id="videoModalOverlay">
            <div class="video-modal-content">
                <button class="btn-close-video-modal" onclick="closeVideoModal()"><i class="fas fa-times"></i></button>
                <div class="video-player-container">
                    <iframe id="videoPlayer" width="100%" height="100%" src="" frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen></iframe>
                </div>
            </div>
        </div>
        <!-- End Video Modal Overlay -->

        <script src="https://common.olemiss.edu/_js/sweet-alert/sweet-alert.min.js"></script>
        <script src="assets/js/check_admin_index.js"></script>
        <script src="assets/js/admin_single_product_view.js"></script>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcOdihg7paX5Mtsw4sQ"
        crossorigin="anonymous"></script>
        <script>

                    function closeVideoModal() {
                        const videoModalOverlay = document.getElementById('videoModalOverlay');
                        const videoPlayer = document.getElementById('videoPlayer');
                        videoPlayer.src = ""; // Stop the video by clearing the src
                        videoModalOverlay.classList.remove('show-video-modal');
                    }

                    // Close modal when clicking outside the video content
                    document.getElementById('videoModalOverlay').addEventListener('click', (event) => {
                        if (event.target === document.getElementById('videoModalOverlay')) {
                            closeVideoModal();
                        }
                    });
        </script>
    </body>

</html>
